name: AI review

# Advisory only. The reviewer agent writes one review to .ai-review/review.md
# and the job posts it as a comment-state review. The job never fails the PR.
# The merge decision stays with a human. See lessons/08.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The model is pinned in .kiro/agents/reviewer.json. The effort is the one
      # knob the agent file can't hold, so it lives here and goes into the footer.
      EFFORT: high
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The guard hook is `node scripts/agent-guard.mjs`, so the reviewer needs Node.
      # No pnpm here: the reviewer never installs or builds, and setup-node's
      # default cache step would fail looking for the pnpm binary.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Review the pull request
        id: review
        continue-on-error: true
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          KIRO_HEADLESS_WORKFLOW_TIMEOUT_SECS: '900'
        run: |
          if [ -z "$KIRO_API_KEY" ]; then
            echo "::notice::KIRO_API_KEY is not set; skipping the AI review (expected on pull requests from forks)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .ai-review
          kiro-cli chat --v3 --no-interactive --agent reviewer --effort "$EFFORT" "Review pull request #${PR_NUMBER}."

      # Posting is the job's step, not the agent's. The agent can only write the
      # file. This is the one line that decides the review state, and it says
      # --comment. Before posting, the job checks the file has the shape the
      # review-pr skill asks for, so a half-formed review never reaches the PR,
      # and appends a footer saying which model and commit produced it.
      - name: Post the review
        if: steps.review.outputs.skipped != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FILE=.ai-review/review.md
          reject() {
            echo "::warning::$1"
            [ -s "$FILE" ] && cat "$FILE"
            gh pr comment "$PR_NUMBER" --body "The AI review did not produce a usable review on this run: $1. See the [run log](${RUN_URL})."
            exit 0
          }
          [ -s "$FILE" ] || reject "the reviewer did not write .ai-review/review.md"
          grep -q '<!-- ai-review -->' "$FILE" || reject "the review has no ai-review marker"
          [ "$(grep -c '^\*\*Verdict for the human reviewer:\*\*' "$FILE")" = 1 ] || reject "the review does not have exactly one verdict line"
          grep -Eq '^\*\*Verdict for the human reviewer:\*\* `(Looks mergeable after the demo|Read the findings first|Do not merge yet)`' "$FILE" || reject "the verdict is not one of the three allowed values"
          for heading in Criteria Findings Evidence 'Merge danger' 'Questions for the author'; do
            grep -q "^### $heading\$" "$FILE" || reject "the review is missing the $heading section"
          done
          if grep -q '\*\*Blocker\*\*' "$FILE" && ! grep -q '`Do not merge yet`' "$FILE"; then
            reject "the review has a Blocker but the verdict is not Do not merge yet"
          fi
          MODEL=$(node -p "require('./.kiro/agents/reviewer.json').model")
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          printf '\n---\n\nModel `%s`, effort `%s`, reviewed commit `%s`, [run log](%s).\n' "$MODEL" "$EFFORT" "$HEAD_SHA" "$RUN_URL" >> "$FILE"
          gh pr review "$PR_NUMBER" --comment --body-file "$FILE"
