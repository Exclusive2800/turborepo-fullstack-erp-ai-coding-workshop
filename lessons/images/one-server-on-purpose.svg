<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">One server, on purpose: the planning flow pointed at Jira through MCP</title><desc id="desc">Four rows. First, two agents side by side. Left, slate: erp, implementer and reviewer from lessons 3, 8 and 9, built-in tools only, includeMcpJson false, no MCP servers, unchanged in this lesson. Right, amber: the planner agent, the same lock plus one MCP server, Atlassian, declared inline, with an allow-list of thirteen named tools out of the 258 the server offers; authorised once in the browser, no secret on disk; used for grill, spec and tickets, never to implement. Second row, one file: docs/agents/issue-tracker.md, the only switch. The skills never name GitHub; they read this file; swap it on a branch and they publish to Jira. Third row, the three steps from lesson 4, run by the planner: grill CR-01, reading TOR 10.3 and the GitHub spec, writing nothing; to-spec, publishing one Epic, ERP-1, labelled ready-for-agent; to-tickets, publishing Stories with the Epic as parent, Blocks links and the same label. Fourth row, greyed: the implement loop, CI, the review and Playwright stay on GitHub; section 11 lists what would change downstream.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:18px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:17px;fill:#172033} .badge {font-size:16px;font-weight:700;fill:#ffffff} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .muted {fill:#94a3b8}</style></defs>
<rect width="1200" height="840" fill="white"/>
<rect x="24" y="24" width="1152" height="792" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="76" class="title" text-anchor="middle">One server, on purpose</text>
<text x="600" y="110" class="body" text-anchor="middle">Lesson 3 locked MCP out of every agent. One agent gets one server, and one file is swapped.</text>

<rect x="60" y="140" width="520" height="210" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
<text x="80" y="172" class="label">erp, implementer, reviewer</text>
<text x="80" y="198" class="small">Lessons 3, 8 and 9. Unchanged here.</text>
<text x="80" y="234" class="code">"tools": ["@builtin"]</text>
<text x="80" y="260" class="code">"includeMcpJson": false</text>
<text x="80" y="298" class="small">No MCP servers. The implement loop</text>
<text x="80" y="324" class="small">keeps running under these agents.</text>

<rect x="620" y="140" width="520" height="210" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="640" y="172" class="label">planner</text>
<text x="640" y="198" class="small">This lesson. The same lock, plus one server.</text>
<text x="640" y="234" class="code">"mcpServers": { "atlassian": { "url": … } }</text>
<text x="640" y="260" class="code">"tools": ["@builtin", "@atlassian/…" × 13]</text>
<text x="640" y="298" class="small">13 tools allowed of 258 offered. Authorised once</text>
<text x="640" y="324" class="small">in the browser. Plans only, never implements.</text>

<path d="M880 350 V386" class="arrow"/>

<rect x="60" y="394" width="1080" height="90" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="80" y="426" class="label">The only switch:</text>
<text x="262" y="426" class="code">docs/agents/issue-tracker.md</text>
<text x="80" y="458" class="small">The skills never name GitHub. They read this file. Swap it on a branch, and they publish to Jira.</text>

<path d="M600 484 V520" class="arrow"/>

<rect x="60" y="528" width="340" height="150" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2"/>
<rect x="76" y="542" width="40" height="36" rx="8" fill="#c08a1d"/><text x="96" y="566" class="badge" text-anchor="middle">1</text>
<text x="130" y="566" class="label">Grill CR-01</text>
<text x="76" y="604" class="code">/grill-me</text>
<text x="76" y="636" class="small">Reads TOR 10.3 and the GitHub</text>
<text x="76" y="660" class="small">spec. Writes nothing.</text>
<path d="M400 603 H422" class="arrow"/>

<rect x="430" y="528" width="340" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="446" y="542" width="40" height="36" rx="8" fill="#64748b"/><text x="466" y="566" class="badge" text-anchor="middle">2</text>
<text x="500" y="566" class="label">Spec: one Epic</text>
<text x="446" y="604" class="code">/to-spec  →  ERP-1</text>
<text x="446" y="636" class="small">Labelled ready-for-agent.</text>
<text x="446" y="660" class="small">Its key feeds step 3.</text>
<path d="M770 603 H792" class="arrow"/>

<rect x="800" y="528" width="340" height="150" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<rect x="816" y="542" width="40" height="36" rx="8" fill="#429782"/><text x="836" y="566" class="badge" text-anchor="middle">3</text>
<text x="870" y="566" class="label">Tickets: Stories</text>
<text x="816" y="604" class="code">/to-tickets ERP-1</text>
<text x="816" y="636" class="small">Parent is the Epic. Blocks links</text>
<text x="816" y="660" class="small">between them. The same label.</text>

<rect x="60" y="706" width="1080" height="90" rx="12" fill="#eef2f7" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 4"/>
<text x="80" y="738" class="label muted">Not in this lesson: the implement loop, CI, the review, Playwright. Still on GitHub.</text>
<text x="80" y="770" class="small muted">Section 11 lists what would change: fetch by key, a frontier JQL can't express, closing by transition.</text>
</svg>
