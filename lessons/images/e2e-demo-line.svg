<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">The Demo line, run by a machine</title><desc id="desc">Top to bottom in four rows. First, the ticket, a slate row: a Demo line, log in as the seeded staff user, see the home page with a healthy API, log out. Second, the agent, an amber row: in a fresh session on a branch, with the write-e2e skill, it writes one Playwright test whose title is the Demo line, with accessible locators only and the saved sign-in, runs pnpm e2e on the host, commits and opens a pull request. Third, GitHub Actions, three checks side by side: check, lint typecheck test build, green; e2e, Postgres, build, Chromium, Playwright, green or red and it blocks the merge; AI review, a comment, never a state. Fourth, you: read the review, open the trace if e2e is red, read the diff against the criteria, merge by hand. A red strip across the e2e box says: zero retries, a test is never loosened to pass, red means the Demo line fails. A note across the bottom says: a model gives advice, a test gives a verdict.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .badge {font-size:16px;font-weight:700;fill:#ffffff} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .who {font-size:15px;font-weight:700;letter-spacing:1px} .no {font-size:15px;font-weight:700;fill:#b42318} .ok {font-size:15px;font-weight:700;fill:#1f7a5c}</style></defs>
<rect width="1200" height="1120" fill="white"/>
<rect x="24" y="24" width="1152" height="1072" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">The Demo line, run by a machine</text>
<text x="600" y="114" class="body" text-anchor="middle">The ticket says what to show. The agent writes it as a test. A clean runner does it on every pull request.</text>

<!-- 1 ticket -->
<rect x="60" y="150" width="1080" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="164" width="40" height="36" rx="8" fill="#64748b"/><text x="96" y="188" class="badge" text-anchor="middle">1</text>
<text x="128" y="189" class="label">The ticket</text>
<text x="76" y="224" class="small">What a person would show when the ticket is done.</text>
<text x="76" y="246" class="small">Lesson 4 wrote it. Nothing ran it, until now.</text>
<rect x="620" y="166" width="504" height="88" rx="8" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="636" y="196" class="code">Demo: log in as the seeded staff user, see the</text>
<text x="636" y="218" class="code">home page with a healthy API, log out</text>
<text x="636" y="240" class="code">Seams: Playwright in apps/e2e</text>
<path d="M600 270 V302" class="arrow"/>

<!-- 2 agent -->
<rect x="60" y="310" width="1080" height="250" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<rect x="76" y="324" width="40" height="36" rx="8" fill="#c08a1d"/><text x="96" y="348" class="badge" text-anchor="middle">2</text>
<text x="128" y="349" class="label">The agent, on a branch, with the write-e2e skill</text>
<text x="76" y="384" class="who" fill="#c08a1d">WRITES</text>
<text x="76" y="410" class="small">One file, apps/e2e/tests/login.e2e.ts.</text>
<text x="76" y="432" class="small">The test's title is the Demo line.</text>
<text x="76" y="454" class="small">Accessible locators only:</text>
<text x="76" y="476" class="small">getByRole, getByLabel, getByText.</text>
<text x="76" y="498" class="small">No CSS, no test IDs, no sleeps.</text>
<text x="76" y="520" class="small">Saved sign-in. Its own rows.</text>
<text x="440" y="384" class="who" fill="#c08a1d">RUNS</text>
<text x="440" y="410" class="small">pnpm e2e, on the host, red then green.</text>
<text x="440" y="432" class="small">Then pnpm check, commit, review,</text>
<text x="440" y="454" class="small">push, and a pull request.</text>
<text x="440" y="476" class="small">Lesson 7's ending.</text>
<rect x="780" y="326" width="344" height="218" rx="8" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="796" y="354" class="code">/implement-ticket #21</text>
<text x="796" y="386" class="code">test('log in as the seeded</text>
<text x="796" y="408" class="code">  staff user, ...', async</text>
<text x="796" y="430" class="code">  ({ page }) =&gt; {</text>
<text x="796" y="452" class="code">  await page</text>
<text x="796" y="474" class="code">    .getByLabel('Email')</text>
<text x="796" y="496" class="code">    .fill(accounts.staff.email);</text>
<text x="796" y="518" class="code">  ...</text>
<path d="M600 560 V592" class="arrow"/>

<!-- 3 actions: three checks -->
<rect x="60" y="600" width="1080" height="250" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="614" width="40" height="36" rx="8" fill="#64748b"/><text x="96" y="638" class="badge" text-anchor="middle">3</text>
<text x="128" y="639" class="label">GitHub Actions, on the pull request. Nobody starts any of these.</text>
<!-- check -->
<rect x="76" y="662" width="330" height="168" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="1.5"/>
<text x="92" y="690" class="label">check</text>
<text x="92" y="716" class="small">Lesson 7. Format, lint, typecheck,</text>
<text x="92" y="738" class="small">unit tests, build. No database.</text>
<text x="92" y="780" class="ok">A check. Red blocks the merge.</text>
<!-- e2e -->
<rect x="422" y="662" width="356" height="168" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="2.5"/>
<text x="438" y="690" class="label">e2e</text>
<text x="438" y="716" class="small">This lesson. Postgres service, migrate,</text>
<text x="438" y="738" class="small">seed, build, Chromium, Playwright.</text>
<text x="438" y="760" class="small">The browser does the Demo line.</text>
<rect x="438" y="772" width="324" height="48" rx="6" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="600" y="792" class="no" text-anchor="middle">Zero retries. Never loosened to pass.</text>
<text x="600" y="812" class="no" text-anchor="middle">Red means the Demo line fails.</text>
<!-- ai review -->
<rect x="794" y="662" width="330" height="168" rx="8" fill="#fff4d6" stroke="#c08a1d" stroke-width="1.5"/>
<text x="810" y="690" class="label">AI review</text>
<text x="810" y="716" class="small">Lesson 8. Reads the ticket, the diff,</text>
<text x="810" y="738" class="small">and now both checks. Never the app.</text>
<text x="810" y="780" class="small" fill="#c08a1d" font-weight="700">A comment. Never a state.</text>
<text x="810" y="802" class="small">A red e2e is a Blocker in its verdict.</text>
<path d="M600 850 V882" class="arrow"/>

<!-- 4 human -->
<rect x="60" y="890" width="1080" height="140" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<rect x="76" y="904" width="40" height="36" rx="8" fill="#429782"/><text x="96" y="928" class="badge" text-anchor="middle">4</text>
<text x="128" y="929" class="label">You, and a colleague</text>
<text x="76" y="964" class="small">Read the review. If e2e is red, open the trace: test or feature?</text>
<text x="76" y="986" class="small">No reset, no manual demo. Read the diff against the criteria.</text>
<text x="76" y="1008" class="small">Tick the boxes. A colleague merges, by hand, if it holds.</text>
<rect x="760" y="906" width="364" height="88" rx="8" fill="#ffffff" stroke="#429782" stroke-width="1.5"/>
<text x="776" y="936" class="code">playwright show-trace trace.zip</text>
<text x="776" y="960" class="code">gh pr merge 21 --squash</text>
<text x="776" y="982" class="small">Only a human runs the second line.</text>

<!-- legend -->
<rect x="60" y="1050" width="1080" height="36" rx="10" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/>
<text x="80" y="1074" class="who" fill="#c08a1d">MODEL</text><text x="150" y="1074" class="small">2 writes the test; the AI review in 3 gives advice.</text>
<text x="560" y="1074" class="who" fill="#429782">TEST</text><text x="610" y="1074" class="small">e2e in 3 gives a verdict. A model advises; a test decides.</text>
</svg>
