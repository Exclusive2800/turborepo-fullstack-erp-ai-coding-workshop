<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">The review-pr skill and the brief</title><desc id="desc">Top to bottom in three rows. First, the brief, reviewer.md, a slate row: not the author, read-only, a refused command is reported and never worked around, run review-pr on the pull request number. The agent file next to it names the model and loads the skill. Second, the skill, review-pr, an amber row with four bands. Reads: the PR and its body, the ticket from the Closes line and the spec it points at, the diff and every test file it touches, CI status, the three AGENTS.md files; it never runs the app. Checks, six boxes in a row: Criteria, Standards, Security, Test adequacy, Evidence, Merge danger. Grades: Blocker gives Do not merge yet, Should fix gives Read the findings first, Nit is dropped, no findings gives Looks mergeable after the demo; the verdict follows the highest level present. Writes: one file, .ai-review/review.md, in a fixed template with a marker, a verdict line, a criteria table, findings with a level and a file and line, evidence, merge danger and questions. Third, the job, a green row: checks the marker, one verdict line, the five headings and that a Blocker means Do not merge yet, appends model, effort, commit and run, and posts with --comment. A file that fails a check never reaches the PR.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .tiny {font-size:14px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .badge {font-size:16px;font-weight:700;fill:#ffffff} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .who {font-size:15px;font-weight:700;letter-spacing:1px} .check {font-size:16px;font-weight:700} .sev {font-size:15px;font-weight:700} .verdict {font-size:15px;font-weight:600;fill:#172033}</style></defs>
<rect width="1200" height="1100" fill="white"/>
<rect x="24" y="24" width="1152" height="1052" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">The review-pr skill and the brief</text>
<text x="600" y="114" class="body" text-anchor="middle">The brief says what the agent may not do. The skill says what a good review is. The job checks the shape.</text>

<!-- 1 brief -->
<rect x="60" y="150" width="1080" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="164" width="40" height="36" rx="8" fill="#64748b"/><text x="96" y="188" class="badge" text-anchor="middle">1</text>
<text x="128" y="189" class="label">Brief: .kiro/agents/reviewer.md</text>
<text x="76" y="224" class="small">Not the author. Read-only. A refused command is reported, never worked around.</text>
<text x="76" y="246" class="small">Run review-pr on #N. Everything about quality is in the skill, not here.</text>
<rect x="720" y="164" width="404" height="82" rx="8" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="736" y="190" class="code">"model": "claude-sonnet-5.5",</text>
<text x="736" y="214" class="code">"resources": [ ...AGENTS.md,</text>
<text x="736" y="238" class="code">  "skill://.kiro/skills/review-pr/SKILL.md"</text>
<path d="M600 260 V292" class="arrow"/>

<!-- 2 skill -->
<rect x="60" y="300" width="1080" height="610" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<rect x="76" y="314" width="40" height="36" rx="8" fill="#c08a1d"/><text x="96" y="338" class="badge" text-anchor="middle">2</text>
<text x="128" y="339" class="label">Skill: .agents/skills/review-pr/SKILL.md</text>
<text x="640" y="339" class="small">One file for all three tools. User-invoked only.</text>

<text x="76" y="376" class="who" fill="#c08a1d">READS</text>
<text x="76" y="400" class="small">The PR and its body</text>
<text x="76" y="422" class="small">The ticket from Closes #T, and the spec it points at</text>
<text x="76" y="444" class="small">The diff, and every test file it touches, in full</text>
<text x="600" y="400" class="small">CI status. It never runs tests, typecheck or build.</text>
<text x="600" y="422" class="small">AGENTS.md at the root, apps/api and apps/web</text>
<text x="600" y="444" class="small">Never the app, Docker or the database.</text>

<text x="76" y="486" class="who" fill="#c08a1d">CHECKS, IN ORDER</text>
<rect x="76" y="498" width="168" height="84" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="88" y="522" class="check">1 Criteria</text>
<text x="88" y="546" class="tiny">file:line per criterion,</text>
<text x="88" y="566" class="tiny">or "not found"</text>
<rect x="254" y="498" width="168" height="84" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="266" y="522" class="check">2 Standards</text>
<text x="266" y="546" class="tiny">AGENTS.md rules only,</text>
<text x="266" y="566" class="tiny">no design opinions</text>
<rect x="432" y="498" width="168" height="84" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="444" y="522" class="check">3 Security</text>
<text x="444" y="546" class="tiny">guards, roles, Zod only,</text>
<text x="444" y="566" class="tiny">no raw SQL, no secrets</text>
<rect x="610" y="498" width="168" height="84" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="622" y="522" class="check">4 Test adequacy</text>
<text x="622" y="546" class="tiny">asserts the outcome,</text>
<text x="622" y="566" class="tiny">not skipped, not mocked</text>
<rect x="788" y="498" width="168" height="84" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="800" y="522" class="check">5 Evidence</text>
<text x="800" y="546" class="tiny">can the Demo line be</text>
<text x="800" y="566" class="tiny">reproduced from the PR?</text>
<rect x="966" y="498" width="168" height="84" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="978" y="522" class="check">6 Merge danger</text>
<text x="978" y="546" class="tiny">migrations, seed, shared</text>
<text x="978" y="566" class="tiny">packages, blocked work</text>

<text x="76" y="624" class="who" fill="#c08a1d">GRADES</text>
<rect x="76" y="636" width="150" height="34" rx="6" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="151" y="659" class="sev" fill="#b42318" text-anchor="middle">Blocker</text>
<path d="M226 653 H262" class="arrow"/>
<rect x="266" y="636" width="290" height="34" rx="6" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="411" y="659" class="verdict" text-anchor="middle">Do not merge yet</text>
<rect x="76" y="682" width="150" height="34" rx="6" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="151" y="705" class="sev" fill="#c08a1d" text-anchor="middle">Should fix</text>
<path d="M226 699 H262" class="arrow"/>
<rect x="266" y="682" width="290" height="34" rx="6" fill="#ffffff" stroke="#c08a1d" stroke-width="1.5"/>
<text x="411" y="705" class="verdict" text-anchor="middle">Read the findings first</text>
<rect x="76" y="728" width="150" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="151" y="751" class="sev" fill="#64748b" text-anchor="middle">Nit</text>
<path d="M226 745 H262" class="arrow"/>
<rect x="266" y="728" width="290" height="34" rx="6" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="411" y="751" class="verdict" text-anchor="middle">Dropped. Never written down.</text>
<rect x="76" y="774" width="150" height="34" rx="6" fill="#ffffff" stroke="#429782" stroke-width="1.5"/>
<text x="151" y="797" class="sev" fill="#429782" text-anchor="middle">No findings</text>
<path d="M226 791 H262" class="arrow"/>
<rect x="266" y="774" width="290" height="34" rx="6" fill="#d9f2e9" stroke="#429782" stroke-width="1.5"/>
<text x="411" y="797" class="verdict" text-anchor="middle">Looks mergeable after the demo</text>
<text x="76" y="840" class="tiny">The verdict follows the highest level present, not an impression.</text>
<text x="76" y="860" class="tiny">Same diff, same verdict. Security and red CI are always Blockers.</text>

<text x="600" y="624" class="who" fill="#c08a1d">WRITES</text>
<rect x="600" y="636" width="534" height="204" rx="8" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="616" y="660" class="code">&lt;!-- ai-review --&gt;</text>
<text x="616" y="682" class="code">## AI review of #N</text>
<text x="616" y="704" class="code">**Verdict for the human reviewer:** `Do not merge yet`.</text>
<text x="616" y="726" class="code">### Criteria     | quoted | file:line or **not found** |</text>
<text x="616" y="748" class="code">### Findings   - **Blocker** `file:line`: what, why</text>
<text x="616" y="770" class="code">### Evidence</text>
<text x="616" y="792" class="code">### Merge danger</text>
<text x="616" y="814" class="code">### Questions for the author</text>
<text x="600" y="860" class="tiny">One file, under 400 words after the table. The agent never posts it.</text>
<text x="76" y="892" class="small">Same guard hook as every agent in the repo, plus permission rules: write only under .ai-review/, allow-listed shell only.</text>
<path d="M600 910 V942" class="arrow"/>

<!-- 3 job -->
<rect x="60" y="950" width="1080" height="110" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<rect x="76" y="964" width="40" height="36" rx="8" fill="#429782"/><text x="96" y="988" class="badge" text-anchor="middle">3</text>
<text x="128" y="989" class="label">Job: the posting step, section 6</text>
<text x="76" y="1020" class="small">Checks the marker, one verdict line, the five headings, and that a Blocker means Do not merge yet.</text>
<text x="76" y="1042" class="small">Appends model, effort, commit and run. A file that fails a check never reaches the PR.</text>
<rect x="890" y="962" width="234" height="66" rx="8" fill="#ffffff" stroke="#429782" stroke-width="1.5"/>
<text x="904" y="988" class="code">gh pr review N --comment</text>
<text x="904" y="1012" class="code">  --body-file review.md</text>
</svg>
