<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Where the control sits: a shell command against an MCP tool call</title><desc id="desc">Two rows, same start. Top row, lessons 4 to 9 on GitHub: you prompt, the agent writes a shell command as text, gh issue create with a parent flag. The PreToolUse guard reads that text and exits 0 or 2; then gh runs on the laptop and talks to GitHub. The control is a pattern on text, in the guard and in the deny list. Bottom row, this lesson on Jira: you prompt, the agent writes a tool call as JSON, createJiraIssue with projectKey ERP and type Epic. The guard box is greyed out: it never sees the call. The host checks the allow-list, thirteen of 258 tools are in the context at all, and asks you; the MCP client sends the call over HTTP to the Atlassian server, which talks to Jira. The control is which tools the model is shown, plus a yes per call. A note says the skills and the tracker doc are the same in both rows; only the lever changed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b4443c"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c08a1d"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:20px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:16px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:14px;fill:#172033} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .arrow-red {fill:none;stroke:#b4443c;stroke-width:2.5;marker-end:url(#arrow-red)} .arrow-amber {fill:none;stroke:#c08a1d;stroke-width:2.5;marker-end:url(#arrow-amber)} .who {font-size:15px;font-weight:700;letter-spacing:1px;fill:#64748b} .muted {fill:#94a3b8}</style></defs>
<rect width="1200" height="700" fill="white"/>
<rect x="24" y="24" width="1152" height="652" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="76" class="title" text-anchor="middle">Where the control sits</text>
<text x="600" y="110" class="body" text-anchor="middle">A shell command is text the guard can read. A tool call is JSON the guard never sees.</text>

<!-- row A -->
<text x="60" y="160" class="who" fill="#b4443c">LESSONS 4 TO 9 · GITHUB THROUGH gh</text>
<rect x="60" y="176" width="110" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="115" y="222" class="label" text-anchor="middle">You</text>
<text x="115" y="248" class="small" text-anchor="middle">/to-spec</text>
<path d="M170 231 H206" class="arrow"/>

<rect x="210" y="176" width="200" height="110" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="310" y="206" class="label" text-anchor="middle">Agent</text>
<text x="310" y="230" class="small" text-anchor="middle">writes a shell command</text>
<text x="310" y="252" class="code" text-anchor="middle">gh issue create</text>
<text x="310" y="270" class="code" text-anchor="middle">--parent 12 ...</text>
<path d="M410 231 H446" class="arrow"/>

<rect x="450" y="176" width="250" height="110" rx="12" fill="#fde8e6" stroke="#b4443c" stroke-width="2"/>
<text x="575" y="206" class="label" text-anchor="middle">PreToolUse guard</text>
<text x="575" y="230" class="small" text-anchor="middle">reads the command as text</text>
<text x="575" y="252" class="code" text-anchor="middle">agent-guard.mjs → exit 0 | 2</text>
<text x="575" y="274" class="small" text-anchor="middle">deny list: gh issue close *</text>
<path d="M700 231 H736" class="arrow-red"/>

<rect x="740" y="176" width="190" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="835" y="206" class="label" text-anchor="middle">Shell</text>
<text x="835" y="230" class="small" text-anchor="middle">runs gh on the laptop;</text>
<text x="835" y="252" class="small" text-anchor="middle">output back to the agent</text>
<path d="M930 231 H966" class="arrow"/>

<rect x="970" y="176" width="170" height="110" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
<text x="1055" y="222" class="label" text-anchor="middle">GitHub</text>
<text x="1055" y="248" class="small" text-anchor="middle">issue #15 created</text>

<text x="60" y="316" class="small"><tspan font-weight="700" fill="#b4443c">The control:</tspan> a rule on text, before the command runs. The guard can refuse; the deny list can name a pattern.</text>

<!-- divider -->
<path d="M60 344 H1140" stroke="#dce3eb" stroke-width="2"/>

<!-- row B -->
<text x="60" y="380" class="who" fill="#c08a1d">THIS LESSON · JIRA THROUGH MCP</text>
<rect x="60" y="396" width="110" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="115" y="452" class="label" text-anchor="middle">You</text>
<text x="115" y="478" class="small" text-anchor="middle">/to-spec</text>
<path d="M170 461 H206" class="arrow"/>

<rect x="210" y="396" width="200" height="130" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="310" y="426" class="label" text-anchor="middle">Agent</text>
<text x="310" y="450" class="small" text-anchor="middle">writes a tool call</text>
<text x="310" y="474" class="code" text-anchor="middle">createJiraIssue</text>
<text x="310" y="492" class="code" text-anchor="middle">{projectKey: "ERP",</text>
<text x="310" y="510" class="code" text-anchor="middle">issuetype: "Epic"}</text>
<path d="M410 461 H446" class="arrow-amber"/>

<!-- guard greyed, small, under the host -->
<rect x="450" y="396" width="250" height="130" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="575" y="426" class="label" text-anchor="middle">Host: allow-list, then ask</text>
<text x="575" y="450" class="small" text-anchor="middle">13 of 258 tools are in the</text>
<text x="575" y="470" class="small" text-anchor="middle">context at all; the rest can't</text>
<text x="575" y="490" class="small" text-anchor="middle">be called. Shows you the JSON,</text>
<text x="575" y="510" class="small" text-anchor="middle">sends nothing until you say yes.</text>
<path d="M700 461 H736" class="arrow-amber"/>

<rect x="740" y="396" width="190" height="130" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
<text x="835" y="426" class="label" text-anchor="middle">MCP client</text>
<text x="835" y="450" class="small" text-anchor="middle">tools/call over HTTP</text>
<text x="835" y="474" class="small" text-anchor="middle">to mcp.atlassian.com,</text>
<text x="835" y="494" class="small" text-anchor="middle">as the account you</text>
<text x="835" y="514" class="small" text-anchor="middle">authorised in the browser</text>
<path d="M930 461 H966" class="arrow"/>

<rect x="970" y="396" width="170" height="130" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
<text x="1055" y="452" class="label" text-anchor="middle">Jira</text>
<text x="1055" y="478" class="small" text-anchor="middle">ERP-1 created</text>

<!-- greyed guard -->
<rect x="450" y="546" width="250" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="575" y="571" class="small muted" text-anchor="middle">guard: never runs, there is no shell</text>

<text x="60" y="616" class="small"><tspan font-weight="700" fill="#c08a1d">The control:</tspan> which tools the model is shown, plus a yes per call. A tool that isn't in the context can't be called by mistake.</text>
<text x="60" y="648" class="small">Same skills, same tracker-doc headings in both rows. Only the lever changed: from a rule on text to a list of names.</text>
</svg>
